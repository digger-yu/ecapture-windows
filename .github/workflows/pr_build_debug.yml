name: PR Build (Debug)
on:
  pull_request:
    branches: [ master, feat/windows-support ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-artifacts:
    runs-on: ubuntu-24.04
    name: Build Windows Debug Artifacts
    strategy:
      matrix:
        arch: [ amd64, arm64 ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Install MinGW (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install --yes mingw-w64-x86-64-dev

      - name: Build Windows ${{ matrix.arch }}
        env:
          CROSS_ARCH: ${{ matrix.arch == 'arm64' && 'arm64' || '' }}
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            CROSS_ARCH=arm64 make windows
          else
            CROSS_ARCH=amd64 make windows
          fi
          mkdir -p dist
          mv bin/ecapture.exe dist/
          mv bin/schannel_hook.dll dist/ 2>/dev/null || true

      - name: Create zip
        env:
          VERSION: v0.0.0-pr-${{ github.event.number || 'dev' }}-debug
        run: |
          cd dist
          zip -r ../ecapture-${{ env.VERSION }}-windows-${{ matrix.arch }}.zip .
          cd ..

      - name: Upload Debug Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ecapture-v0.0.0-pr-${{ github.event.number || 'dev' }}-debug-windows-${{ matrix.arch }}.zip
          path: ecapture-v0.0.0-pr-${{ github.event.number || 'dev' }}-debug-windows-${{ matrix.arch }}.zip
          retention-days: 7

      - name: List Built Artifacts
        run: |
          echo "Built debug artifacts:"
          ls -lh *.zip
